plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.78'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

// Mojang ships Java 21 to end users in 1.20.5+, so mods should target Java 21.
java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

// Embers Re-Ignited drops its own recipe data generators from its published jar (see the matching
// exclude block in its build.gradle), so EmbersRecipes, AlchemyRecipeBuilder, ConsumerWrapperBuilder
// and friends are simply not on the classpath any more. Aetherworks' recipe generator is written
// against those classes, so it is excluded here for the same reason. The recipes it used to emit are
// already committed under src/generated/resources and ship unchanged; only regenerating them is
// unavailable until Embers restores its datagen API.
sourceSets.main.java {
    exclude 'net/sirplop/aetherworks/datagen/AWRecipes.java'
    exclude 'net/sirplop/aetherworks/recipe/*RecipeBuilder.java'
}

neoForge {
    version = neoforge_version

    // Parchment is an unofficial project maintained by ParchmentMC, separate from NeoForged.
    // Additional setup is needed to use their mappings: https://parchmentmc.org/docs/getting-started
    parchment {
        minecraftVersion = parchment_minecraft_version
        mappingsVersion = parchment_mappings_version
    }

    // This property enables access transformers for use in development.
    // They will be applied to the Minecraft artifact. The file must be at
    // "META-INF/accesstransformer.cfg" in the final mod jar to be loaded by NeoForge.
    accessTransformers.from(file('src/main/resources/META-INF/accesstransformer.cfg'))

    runs {
        configureEach {
            // Recommended logging data for a userdev environment.
            // The markers can be added/removed as needed, separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            // Recommended logging level for the console.
            logLevel = org.slf4j.event.Level.DEBUG
        }

        client {
            client()
            gameDirectory = file('run/client')
            programArguments.addAll '--username', 'Dev'
            // A small window keeps the software renderer usable in headless CI-style runs.
            if (project.hasProperty('smallWindow')) {
                programArguments.addAll '--width', '400', '--height', '300'
            }
            // ./gradlew runClient -PquickPlay=<save name> boots straight into a world,
            // which is handy for checking rendering without clicking through the menus.
            if (project.hasProperty('quickPlay')) {
                programArguments.addAll '--quickPlaySingleplayer', project.property('quickPlay').toString()
            }
            // ...or -PquickPlayServer=localhost to join a running dev server instead.
            if (project.hasProperty('quickPlayServer')) {
                programArguments.addAll '--quickPlayMultiplayer', project.property('quickPlayServer').toString()
            }
        }

        server {
            server()
            gameDirectory = file('run/server')
            programArgument '--nogui'
        }

        // Runs all registered gametests, then exits.
        gameTestServer {
            type = 'gameTestServer'
            gameDirectory = file('run/gametest')
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }

        data {
            data()
            gameDirectory = file('run/data')
            // Specify the modid for data generation, where to output the resulting resource,
            // and where to look for existing resources.
            programArguments.addAll '--mod', mod_id, '--all', '--output',
                    file('src/generated/resources/').absolutePath, '--existing',
                    file('src/main/resources/').absolutePath
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

repositories {
    mavenCentral()
    maven { // Embers Re-Ignited
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }
    maven { // jei
        name = 'BlameJared'
        url = 'https://maven.blamejared.com/'
    }
    maven { // curios
        name = 'Illusive Soulworks maven'
        url = 'https://maven.theillusivec4.top/'
    }
}

dependencies {
    // Embers Re-Ignited. "8znVCTxA" is the Modrinth project id for embers-re-ignited.
    implementation "maven.modrinth:8znVCTxA:${embers_version}"

    // Compile against the JEI API, and use the full artifact at runtime.
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    runtimeOnly "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"

    // Curios is an optional integration, so it is only needed at compile time.
    compileOnly "top.theillusivec4.curios:curios-neoforge:${curios_version}"
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error.
var replaceProperties = [
        minecraft_version      : minecraft_version,
        minecraft_version_range: minecraft_version_range,
        neoforge_version       : neoforge_version,
        neoforge_version_range : neoforge_version_range,
        loader_version_range   : loader_version_range,
        mod_id                 : mod_id,
        mod_name               : mod_name,
        mod_license            : mod_license,
        mod_version            : mod_version,
        mod_authors            : mod_authors,
        mod_description        : mod_description,
]

tasks.named('processResources', ProcessResources).configure {
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1', // We are version 1 of ourselves
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
        ])
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
    options.compilerArgs.addAll(['-Xmaxerrs', '10000'])
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

// Dumps the resolved compile classpath so the sources can be type-checked with a bare
// javac invocation, which is far quicker than a full Gradle round trip while porting.
tasks.register('dumpClasspath') {
    def out = layout.buildDirectory.file('cp.txt')
    def cp = sourceSets.main.compileClasspath
    outputs.file(out)
    doLast {
        out.get().asFile.text = cp.asPath
    }
}
